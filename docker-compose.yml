services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_sql_job_connections.sql:/docker-entrypoint-initdb.d/002_sql_job_connections.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-scheduler}?sslmode=disable
      API_PORT: "8080"
      JWT_SECRET: 'WiPNf8y9j01r9yRCUVH7kBhCwyRzD0Dnx5TP5NTENjU='
      SQL_CREDENTIALS_KEY: ${SQL_CREDENTIALS_KEY:?Set SQL_CREDENTIALS_KEY in .env}
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin0123
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: job-scheduler-worker:latest
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-scheduler}?sslmode=disable
      SQL_CREDENTIALS_KEY: ${SQL_CREDENTIALS_KEY:?Set SQL_CREDENTIALS_KEY in .env}
      REDIS_ADDR: redis:6379
      JOB_CONTAINER_IMAGE: job-scheduler-worker:latest
      SCRIPTS_HOST_PATH: ${SCRIPTS_HOST_PATH:?Set SCRIPTS_HOST_PATH to an absolute host path}
      JOB_CONTAINER_MEMORY_BYTES: ${JOB_CONTAINER_MEMORY_BYTES:-268435456}
      JOB_CONTAINER_NANO_CPUS: ${JOB_CONTAINER_NANO_CPUS:-500000000}
      JOB_CONTAINER_PIDS_LIMIT: ${JOB_CONTAINER_PIDS_LIMIT:-128}
      JOB_CONTAINER_NETWORK_DISABLED: ${JOB_CONTAINER_NETWORK_DISABLED:-true}
    volumes:
      - ./scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-scheduler}?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
