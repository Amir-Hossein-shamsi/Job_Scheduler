basePath: /
definitions:
  api.createJobRequest:
    properties:
      args:
        items:
          type: string
        type: array
      connection:
        $ref: '#/definitions/api.sqlConnectionRequest'
      description:
        type: string
      enabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      script_content:
        type: string
      script_path:
        type: string
      script_type:
        type: string
      timeout_seconds:
        type: integer
      working_dir:
        type: string
    type: object
  api.jobResponse:
    properties:
      args:
        items:
          type: string
        type: array
      connection:
        $ref: '#/definitions/api.sqlConnectionResponse'
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      name:
        type: string
      script_content:
        type: string
      script_path:
        type: string
      script_type:
        type: string
      timeout_seconds:
        type: integer
      updated_at:
        type: string
      working_dir:
        type: string
    type: object
  api.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  api.loginResponse:
    properties:
      token:
        type: string
    type: object
  api.meResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  api.runResponse:
    properties:
      created_at:
        type: string
      error_message:
        type: string
      exit_code:
        type: integer
      finished_at:
        type: string
      id:
        type: string
      job_id:
        type: string
      started_at:
        type: string
      status:
        type: string
      trigger_type:
        type: string
      triggered_by:
        type: string
      worker_id:
        type: string
    type: object
  api.scheduleRequest:
    properties:
      cron_expr:
        type: string
      enabled:
        type: boolean
      interval_seconds:
        type: integer
      run_at:
        type: string
      timezone:
        type: string
      type:
        type: string
    type: object
  api.scheduleResponse:
    properties:
      created_at:
        type: string
      cron_expr:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      interval_seconds:
        type: integer
      job_id:
        type: string
      next_run_at:
        type: string
      run_at:
        type: string
      timezone:
        type: string
      type:
        type: string
    type: object
  api.sqlConnectionRequest:
    properties:
      database:
        type: string
      engine:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      tls_enabled:
        type: boolean
      trust_server_certificate:
        type: boolean
      username:
        type: string
    type: object
  api.sqlConnectionResponse:
    properties:
      database:
        type: string
      engine:
        type: string
      host:
        type: string
      password_configured:
        type: boolean
      port:
        type: integer
      tls_enabled:
        type: boolean
      trust_server_certificate:
        type: boolean
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Admin API for managing scheduled jobs and their runs.
  title: Job Scheduler API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.loginResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Login
      tags:
      - Auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.meResponse'
        "401":
          description: Authentication required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get current admin
      tags:
      - Auth
  /api/jobs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.jobResponse'
            type: array
        "401":
          description: Authentication required
          schema:
            type: string
        "500":
          description: Database error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List jobs
      tags:
      - Jobs
    post:
      consumes:
      - application/json
      parameters:
      - description: Job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.jobResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Authentication required
          schema:
            type: string
        "500":
          description: Database error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a job
      tags:
      - Jobs
  /api/jobs/{id}/run:
    post:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.runResponse'
      security:
      - BearerAuth: []
      summary: Trigger a job manually
      tags:
      - Runs
  /api/jobs/{id}/runs:
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: List job runs
      tags:
      - Runs
  /api/jobs/{id}/schedules:
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.scheduleResponse'
            type: array
        "401":
          description: Authentication required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List schedules for a job
      tags:
      - Schedules
    post:
      consumes:
      - application/json
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: Schedule details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.scheduleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.scheduleResponse'
        "400":
          description: Invalid schedule
          schema:
            type: string
        "401":
          description: Authentication required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a schedule
      tags:
      - Schedules
  /api/runs/{id}:
    get:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get a run
      tags:
      - Runs
  /api/runs/{id}/logs:
    get:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: Return logs after this ID
        in: query
        name: after
        type: integer
      - description: Maximum logs to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get run logs
      tags:
      - Runs
  /api/runs/{id}/logs/stream:
    get:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses: {}
      security:
      - BearerAuth: []
      summary: Stream run logs
      tags:
      - Runs
  /api/schedules/{id}:
    delete:
      parameters:
      - description: Schedule ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Authentication required
          schema:
            type: string
        "404":
          description: Schedule not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a schedule
      tags:
      - Schedules
    patch:
      consumes:
      - application/json
      parameters:
      - description: Schedule ID
        in: path
        name: id
        required: true
        type: string
      - description: Schedule details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.scheduleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.scheduleResponse'
        "400":
          description: Invalid schedule
          schema:
            type: string
        "401":
          description: Authentication required
          schema:
            type: string
        "404":
          description: Schedule not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a schedule
      tags:
      - Schedules
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer" followed by a space and your JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
