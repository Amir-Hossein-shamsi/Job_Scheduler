basePath: /
definitions:
  main.createJobRequest:
    properties:
      args:
        items:
          type: string
        type: array
      description:
        type: string
      enabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      script_content:
        type: string
      script_path:
        type: string
      script_type:
        type: string
      timeout_seconds:
        type: integer
      working_dir:
        type: string
    type: object
  main.jobResponse:
    properties:
      args:
        items:
          type: string
        type: array
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      id:
        type: string
      name:
        type: string
      script_content:
        type: string
      script_path:
        type: string
      script_type:
        type: string
      timeout_seconds:
        type: integer
      updated_at:
        type: string
      working_dir:
        type: string
    type: object
  main.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  main.loginResponse:
    properties:
      token:
        type: string
    type: object
  main.meResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  main.runResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      job_id:
        type: string
      status:
        type: string
      trigger_type:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Admin API for managing scheduled jobs and their runs.
  title: Job Scheduler API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Admin credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.loginResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Login
      tags:
      - Auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.meResponse'
        "401":
          description: Authentication required
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get current admin
      tags:
      - Auth
  /api/jobs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.jobResponse'
            type: array
        "401":
          description: Authentication required
          schema:
            type: string
        "500":
          description: Database error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List jobs
      tags:
      - Jobs
    post:
      consumes:
      - application/json
      parameters:
      - description: Job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.createJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.jobResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Authentication required
          schema:
            type: string
        "500":
          description: Database error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a job
      tags:
      - Jobs
  /api/jobs/{id}/run:
    post:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/main.runResponse'
        "401":
          description: Authentication required
          schema:
            type: string
        "404":
          description: Job not found
          schema:
            type: string
        "409":
          description: Job is disabled
          schema:
            type: string
        "500":
          description: Could not create run
          schema:
            type: string
        "503":
          description: Could not queue run
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Trigger a job manually
      tags:
      - Runs
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer" followed by a space and your JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
